<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Laboratório de Pressão Excedente</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background: #1a1a1a; color: white; margin: 0; }
        .topo { width: 100%; background: #333; padding: 20px; text-align: center; box-shadow: 0 2px 10px black; }
        #barra-pressao { font-size: 2em; color: #3498db; font-weight: bold; }
        #bolha { 
            border-radius: 50%; 
            margin: 50px auto; 
            transition: background 0.3s, width 0.1s, height 0.1s;
            border: 2px solid white;
        }
        input[type=range] { width: 80%; max-width: 400px; margin-top: 20px; }
    </style>
</head>
<body>

<div class="topo">
    <h1>Laboratório de Laplace</h1>
    <p>Feche a mão (mova a barra) = Aumenta a Pressão</p>
    <div id="barra-pressao">ΔP: 0.00 Pa</div>
</div>

<div id="bolha"></div>

<input type="range" id="slider" min="20" max="200" value="200">

<script>
    const slider = document.getElementById('slider');
    const bolha = document.getElementById('bolha');
    const texto = document.getElementById('barra-pressao');
    const gamma = 0.072;

    slider.oninput = function() {
        // O valor do slider invertido para simular "fechar" (quanto menor o raio, maior a pressão)
        const raio = 220 - this.value; 
        const pressao = (2 * gamma) / (raio / 1000);
        
        // Atualiza tamanho
        bolha.style.width = (raio * 2) + 'px';
        bolha.style.height = (raio * 2) + 'px';
        
        // Atualiza cor: Azul (baixa) -> Vermelho (alta)
        const intensidade = Math.min(255, pressao / 5);
        bolha.style.backgroundColor = `rgb(${intensidade}, 100, ${255 - intensidade})`;
        
        texto.innerText = "ΔP: " + pressao.toFixed(2) + " Pa";
        texto.style.color = intensidade > 127 ? "#e74c3c" : "#3498db";
    }
    
    // Iniciar
    slider.oninput();
</script>

</body>
</html>
