<!DOCTYPE html>
<html>
<head>
    <title>Pressão de Laplace com a Mão</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <style>
        body { text-align: center; font-family: sans-serif; background: #222; color: white; }
        #container { position: relative; width: 640px; height: 480px; margin: auto; }
        video { position: absolute; left: 0; top: 0; transform: scaleX(-1); }
        canvas { position: absolute; left: 0; top: 0; transform: scaleX(-1); }
        #info { margin-top: 20px; }
    </style>
</head>
<body>
    <h1>Aperte a Bolha</h1>
    <div id="container">
        <video id="webcam" width="640" height="480" autoplay></video>
        <canvas id="output" width="640" height="480"></canvas>
    </div>
    <div id="info">Distância entre dedos: <span id="dist">0</span> | Pressão: <span id="pressao">0</span></div>

<script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('output');
    const ctx = canvas.getContext('2d');
    const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
    
    hands.onResults((results) => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (results.multiHandLandmarks) {
            for (const landmarks of results.multiHandLandmarks) {
                // Pontos 4 (polegar) e 8 (indicador)
                const d = Math.hypot(landmarks[4].x - landmarks[8].x, landmarks[4].y - landmarks[8].y);
                const raio = Math.max(10, d * 500);
                const pressao = 1000 / raio;
                
                // Mapear cor: 0 (azul) a 100 (vermelho)
                const red = Math.min(255, pressao * 5);
                ctx.fillStyle = `rgb(${red}, 100, ${255 - red})`;
                ctx.beginPath();
                ctx.arc(320, 240, raio, 0, 2 * Math.PI);
                ctx.fill();
                document.getElementById('dist').innerText = d.toFixed(2);
                document.getElementById('pressao').innerText = pressao.toFixed(2);
            }
        }
    });

    const camera = new Camera(video, { onFrame: async () => { await hands.send({image: video}); } });
    camera.start();
</script>
</body>
</html>
